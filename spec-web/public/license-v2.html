<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>License Management v2</title>
<style>
  /* Shown inside Product > License v2 (iframe); tokens mirror spec-web's index.html so it blends in. */
  :root {
    --bg:#0f172a; --raised:#1e293b; --sunken:#0a0f1f; --line:#243044;
    --fg:#f1f5f9; --fg2:#cbd5e1; --fg3:#94a3b8;
    --brand:#22c55e; --accent:#eab308; --red:#ef4444; --blue:#38bdf8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; }
  header { padding:14px 16px 0; }
  h1 { margin:0; font-size:20px; }
  .sub { color:var(--fg3); font-size:13px; margin-top:2px; }
  [role=tablist] { display:flex; gap:6px; padding:12px 16px 0; overflow-x:auto; border-bottom:1px solid var(--line); flex-shrink:0; }
  [role=tab] { font:inherit; font-size:14px; color:var(--fg2); background:none; border:0; border-bottom:3px solid transparent; padding:8px 12px; cursor:pointer; white-space:nowrap; }
  [role=tab][aria-selected=true] { color:var(--fg); border-bottom-color:var(--brand); }
  [role=tab]:focus-visible,button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  main { flex:1; min-height:0; overflow:auto; padding:18px 16px 28px; }
  .pane { max-width:820px; margin:0 auto; display:none; flex-direction:column; gap:14px; }
  .pane.on { display:flex; }
  .stage { background:var(--sunken); border:1px solid var(--line); border-radius:10px; padding:10px; overflow-x:auto; }
  .stage svg { display:block; width:100%; min-width:520px; height:auto; }
  .cap { min-height:3.2rem; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .cap .say { font-size:18px; font-weight:600; flex:1; min-width:180px; }
  .dots { display:flex; gap:6px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:var(--line); transition:background .2s; }
  .dots i.on { background:var(--brand); }
  .btn { font:inherit; font-size:13px; color:var(--fg); background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  .btn:hover { border-color:var(--fg3); }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg .btn[aria-pressed=true] { background:var(--brand); border-color:var(--brand); color:#04210f; font-weight:600; }
  /* svg parts */
  svg text { fill:var(--fg); font:600 14px system-ui,sans-serif; }
  svg .s { fill:var(--fg3); font:400 11.5px var(--mono); }
  svg .actor { fill:var(--raised); stroke:var(--fg3); stroke-width:1.5; }
  svg .link { stroke:var(--line); stroke-width:3; fill:none; }
  svg .flow { stroke:var(--blue); stroke-width:2; fill:none; stroke-dasharray:6 8; animation:flow 1.2s linear infinite; }
  svg .tok { fill:var(--accent); }
  svg .ok { fill:var(--brand); }
  svg .bad { fill:var(--red); }
  svg .pill { fill:var(--sunken); stroke:var(--accent); stroke-width:1.2; }
  svg .dot { fill:var(--line); transition:fill .15s; }
  svg .dot.on { fill:var(--brand); }
  svg .dot.warm { fill:var(--blue); }
  @keyframes flow { to { stroke-dashoffset:-28; } }
  @keyframes pulse { 50% { opacity:.45; } }
  .qs { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
  .q { background:var(--raised); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:10px 12px; }
  .q b { display:block; }
  .q span { color:var(--fg3); font-size:13px; }
  .rules { display:flex; flex-wrap:wrap; gap:8px; }
  .rule { background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px; }
  .rule em { color:var(--brand); font-style:normal; font-weight:700; }
  @media (prefers-reduced-motion:reduce) { svg .flow { animation:none; } }
  /* Flow simulation scene */
  .pane.wide { max-width:1000px; width:100%; }
  .fsec { display:flex; flex-direction:column; gap:14px; }
  .fsec[hidden] { display:none; }
  svg .fn .shape { fill:var(--raised); stroke:var(--fg3); stroke-width:1.5; }
  svg .fn.ok .shape { stroke:var(--brand); } svg .fn.bad .shape { stroke:var(--red); } svg .fn.warn .shape { stroke:var(--accent); stroke-width:2.2; }
  svg .ft { font:600 12.5px system-ui,sans-serif; }
  svg .tg { fill:var(--accent); } svg .tgt { fill:#2a1f00; font:700 10.5px var(--mono); }
  svg .arr { stroke:var(--fg3); stroke-width:1.6; fill:none; marker-end:url(#arrow); }
  svg .el { fill:var(--fg3); font:400 11px var(--mono); }
  svg .gx { stroke:var(--line); stroke-width:1; } svg .ga { stroke:var(--fg3); stroke-width:1.2; }
  svg .gl { fill:var(--fg3); font:400 11px var(--mono); }
  .fcap { color:var(--fg3); font-size:13px; margin:0; }
  svg .tgb { cursor:pointer; outline:none; } svg .tgb:hover .tg, svg .tgb:focus-visible .tg { fill:#fff; }
  .detail { position:sticky; top:0; z-index:5; background:var(--raised); border:1px solid var(--accent); border-radius:8px; padding:10px 12px; max-height:40vh; overflow:auto; }
  .detail .dt { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .detail .muted { color:var(--fg3); font-size:13px; }
  .detail .dtx { margin:6px 0 0; font-size:14px; }
  .detail .dk { margin:8px 0 2px; font:600 11px var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--fg3); }
  .detail ul { margin:2px 0 0; padding-left:18px; font-size:13px; color:var(--fg2); }
  .tagbar { display:flex; flex-wrap:wrap; gap:6px; }
  .tagbtn { font:700 12px var(--mono); border-radius:999px; padding:3px 11px; cursor:pointer; background:var(--sunken); color:var(--fg); border:1px solid var(--accent); }
  .tagbtn.to { border-color:var(--line); color:var(--fg2); }
  .tagbtn:hover { background:var(--accent); color:#2a1f00; }
  .fsec h3 { margin:6px 0 0; font-size:15px; }
  .simgrid { display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:14px; align-items:start; }
  @media (max-width:760px) { .simgrid { grid-template-columns:minmax(0,1fr); } }
  .box { background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .box label { font-size:12.5px; color:var(--fg3); display:flex; flex-direction:column; gap:4px; }
  .box label.chk { flex-direction:row; align-items:flex-start; gap:8px; color:var(--fg2); }
  .box select { font:inherit; font-size:13px; color:var(--fg); background:var(--sunken); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.go { background:var(--brand); border-color:var(--brand); color:#04210f; font-weight:600; }
  .counters { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .counters .n { font:600 26px var(--mono); font-variant-numeric:tabular-nums; }
  .counters .n.full { color:var(--red); }
  .counters .k { font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--fg3); }
  .sumline { font-size:13px; color:var(--fg2); min-height:1.3em; margin:0; }
  .log { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .log table, .qt table { width:100%; border-collapse:collapse; font-size:13px; }
  .log th, .log td, .qt th, .qt td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .log th, .qt th { position:sticky; top:0; background:var(--raised); font:500 11px var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--fg3); }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .pl { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .pl.ok { background:#12301f; color:#5fcf8e; } .pl.bad { background:#3d1815; color:#ff8a80; } .pl.info { background:#123845; color:#5cc0e2; }
  .qt { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  .qt table { min-width:700px; } .qt td:first-child { white-space:nowrap; font-family:var(--mono); font-weight:600; }
  .sev-b { color:var(--red); font:600 11px var(--mono); } .sev-o { color:var(--fg3); font:600 11px var(--mono); }
  /* ?embed=1: the feature page supplies the title and the scene list, so this page shows only the animation. */
  html.embed header, html.embed [role=tablist] { display:none; }
</style>
</head>
<body>
<script>if (location.search.indexOf('embed=1') >= 0) document.documentElement.className = 'embed'</script>
<header>
  <h1>License Management v2</h1>
  <div class="sub">One license per ball · many tablets · users counted on the server</div>
</header>
<div role="tablist" id="tabs" aria-label="Use cases"></div>
<main id="main"></main>

<script>
(function () {
  'use strict'
  var NS = 'http://www.w3.org/2000/svg'
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
  var runId = 0

  function el(tag, attrs, parent, text) {
    var n = document.createElementNS(NS, tag)
    for (var k in attrs) n.setAttribute(k, attrs[k])
    if (text != null) n.textContent = text
    if (parent) parent.appendChild(n)
    return n
  }
  function h(tag, cls, parent, text) {
    var n = document.createElement(tag)
    if (cls) n.className = cls
    if (text != null) n.textContent = text
    if (parent) parent.appendChild(n)
    return n
  }
  function sleep(ms, id) {
    return new Promise(function (res) { setTimeout(function () { res(id === runId) }, REDUCED ? 0 : ms) })
  }

  // ── Scene: Ball —Bluetooth— Tablet —Internet— Server ─────────────────────
  var X = { ball: [50, 170], tablet: [300, 420], server: [550, 670] }
  var TITLE = { ball: 'Ball', tablet: 'Tablet', server: 'Server' }

  function buildScene(pane, cfg) {
    var stage = h('div', 'stage', pane)
    var svg = el('svg', { viewBox: '0 0 720 250', role: 'img', 'aria-label': cfg.label }, stage)
    el('path', { d: 'M170 75 H300', class: 'link' }, svg)
    el('path', { d: 'M420 75 H550', class: 'link' }, svg)
    el('text', { x: 235, y: 62, 'text-anchor': 'middle', class: 's' }, svg, 'Bluetooth')
    el('text', { x: 485, y: 62, 'text-anchor': 'middle', class: 's' }, svg, 'Internet')
    var notes = {}
    ;['ball', 'tablet', 'server'].forEach(function (a) {
      var x = X[a][0]
      el('rect', { x: x, y: 40, width: 120, height: 70, rx: 10, class: 'actor' }, svg)
      el('text', { x: x + 60, y: 70, 'text-anchor': 'middle' }, svg, a === 'tablet' ? cfg.tablet : TITLE[a])
      el('text', { x: x + 60, y: 90, 'text-anchor': 'middle', class: 's' }, svg, cfg.sub[a] || '')
      notes[a] = el('text', { x: x + 60, y: 134, 'text-anchor': 'middle', class: 's' }, svg, '')
    })
    var cut = el('g', { opacity: 0 }, svg)
    el('path', { d: 'M470 58 l30 34 M500 58 l-30 34', stroke: 'var(--red)', 'stroke-width': 5, 'stroke-linecap': 'round' }, cut)
    var badge = el('g', { opacity: 0 }, svg)
    var badgeRect = el('rect', { x: 260, y: 168, width: 200, height: 40, rx: 20 }, badge)
    var badgeText = el('text', { x: 360, y: 193, 'text-anchor': 'middle', style: 'fill:#04210f' }, badge, '')
    var tok = el('g', { opacity: 0, style: 'transform:translate(0px,75px)' }, svg)
    var pill = el('rect', { y: -40, height: 22, rx: 11, class: 'pill' }, tok)
    var pillText = el('text', { y: -25, 'text-anchor': 'middle', style: 'font-size:12px' }, tok, '')
    el('circle', { r: 9, class: 'tok' }, tok)
    return { notes: notes, cut: cut, badge: badge, badgeRect: badgeRect, badgeText: badgeText, tok: tok, pill: pill, pillText: pillText }
  }

  function moveToken(s, from, to, label, fail, id) {
    var rightward = X[to][0] > X[from][0]
    var fx = rightward ? X[from][1] : X[from][0]
    var tx = rightward ? X[to][0] : X[to][1]
    var mid = fail ? fx + (tx - fx) * 0.45 : tx
    s.pillText.textContent = label
    var w = Math.max(60, label.length * 8 + 20)
    s.pill.setAttribute('width', w); s.pill.setAttribute('x', -w / 2)
    s.pillText.setAttribute('x', 0)
    s.tok.setAttribute('opacity', 1)
    function go(a, b, ms) {
      if (REDUCED) { s.tok.style.transform = 'translate(' + b + 'px,75px)'; return Promise.resolve(id === runId) }
      var an = s.tok.animate([{ transform: 'translate(' + a + 'px,75px)' }, { transform: 'translate(' + b + 'px,75px)' }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' })
      return an.finished.then(function () { return id === runId }, function () { return false })
    }
    return go(fx, mid, fail ? 650 : 950).then(function (ok) {
      if (!ok || !fail) { if (ok) s.tok.setAttribute('opacity', 0); return ok }
      var dot = s.tok.querySelector('circle')
      dot.setAttribute('style', 'fill:var(--red)')
      return sleep(300, id).then(function (ok2) { return ok2 && go(mid, fx, 500) }).then(function (ok3) {
        s.tok.setAttribute('opacity', 0); dot.removeAttribute('style'); return ok3
      })
    })
  }

  function showBadge(s, good, text) {
    s.badgeRect.setAttribute('class', good ? 'ok' : 'bad')
    s.badgeText.textContent = (good ? '✓ ' : '✕ ') + text
    s.badgeText.style.fill = good ? '#04210f' : '#fff'
    s.badge.setAttribute('opacity', 1)
  }

  function scenePane(cfg) {
    var pane = h('div', 'pane')
    var s = buildScene(pane, cfg)
    var cap = h('div', 'cap', pane)
    var say = h('div', 'say', cap)
    say.setAttribute('aria-live', 'polite')
    var dots = h('div', 'dots', cap)
    cfg.steps.forEach(function () { h('i', '', dots) })
    var btn = h('button', 'btn', cap, '↻ Replay')
    btn.type = 'button'

    function reset() {
      s.badge.setAttribute('opacity', 0); s.tok.setAttribute('opacity', 0)
      s.cut.setAttribute('opacity', cfg.offline ? 1 : 0)
      for (var k in s.notes) s.notes[k].textContent = (cfg.start && cfg.start[k]) || ''
      say.textContent = cfg.intro
      dots.childNodes.forEach(function (d) { d.className = '' })
    }
    async function play() {
      var id = ++runId
      reset()
      if (!(await sleep(500, id))) return
      for (var i = 0; i < cfg.steps.length; i++) {
        var st = cfg.steps[i]
        say.textContent = st.say
        dots.childNodes[i].className = 'on'
        if (st.note) for (var k in st.note) s.notes[k].textContent = st.note[k]
        if (st.move) { if (!(await moveToken(s, st.move[0], st.move[1], st.move[2], st.fail, id))) return }
        if (st.result) showBadge(s, st.result[0], st.result[1])
        if (!(await sleep(st.hold || 700, id))) return
      }
    }
    btn.onclick = play
    pane._play = play
    return pane
  }

  // ── Dot grids (user slots) ───────────────────────────────────────────────
  function grid(svg, x, y, n, cols, r, gap) {
    var out = []
    for (var i = 0; i < n; i++) {
      out.push(el('circle', { cx: x + (i % cols) * gap, cy: y + Math.floor(i / cols) * gap, r: r, class: 'dot' }, svg))
    }
    return out
  }
  async function fill(dots, upto, ms, id, cls) {
    for (var i = 0; i < upto; i++) {
      dots[i].setAttribute('class', 'dot ' + (cls || 'on'))
      if (ms && i % 2 === 0 && !(await sleep(ms, id))) return false
    }
    return id === runId
  }

  function capPane() {
    var pane = h('div', 'pane')
    var seg = h('div', 'seg', pane)
    var tiers = [{ n: 1, name: 'MyPlayBall · 1' }, { n: 50, name: 'Basic · 50' }, { n: Infinity, name: 'Premium · ∞' }]
    var stage = h('div', 'stage', pane)
    var svg = el('svg', { viewBox: '0 0 720 250', role: 'img', 'aria-label': 'Users fill the ball slots until the cap blocks the next user' }, stage)
    var cap = h('div', 'cap', pane)
    var say = h('div', 'say', cap)
    say.setAttribute('aria-live', 'polite')
    var btn = h('button', 'btn', cap, '↻ Replay'); btn.type = 'button'
    var current = 1
    var btns = tiers.map(function (t, i) {
      var b = h('button', 'btn', seg, t.name); b.type = 'button'
      b.onclick = function () { current = i; run() }
      return b
    })
    async function run() {
      var id = ++runId
      btns.forEach(function (b, i) { b.setAttribute('aria-pressed', i === current ? 'true' : 'false') })
      while (svg.firstChild) svg.removeChild(svg.firstChild)
      var t = tiers[current]
      var shown = t.n === 1 ? 1 : 50
      var cols = shown === 1 ? 1 : 10
      var gap = 30, r = shown === 1 ? 16 : 11
      var gx = shown === 1 ? 120 : 60, gy = shown === 1 ? 110 : 40
      var dots = grid(svg, gx, gy, shown, cols, r, gap)
      var counter = el('text', { x: 520, y: 90, style: 'font-size:34px' }, svg, '0 / ' + (t.n === Infinity ? '∞' : t.n))
      var next = el('g', { opacity: 0, style: 'transform:translate(660px,150px)' }, svg)
      el('circle', { r: 16, fill: 'var(--accent)' }, next)
      el('text', { y: 38, 'text-anchor': 'middle', class: 's' }, next, 'next user')
      var result = el('text', { x: 520, y: 140, style: 'font-size:20px' }, svg, '')
      say.textContent = t.n === 1 ? 'One user fits' : t.n === 50 ? 'Users join, slots fill' : 'No limit, slots keep coming'
      if (!(await sleep(400, id))) return
      var n = shown
      for (var i = 0; i < n; i++) {
        dots[i].setAttribute('class', 'dot on')
        counter.textContent = (i + 1) + ' / ' + (t.n === Infinity ? '∞' : t.n)
        if (shown > 1 && !(await sleep(55, id))) return
        if (shown === 1 && !(await sleep(300, id))) return
      }
      if (!(await sleep(500, id))) return
      next.setAttribute('opacity', 1)
      if (!REDUCED) await next.animate([{ transform: 'translate(660px,150px)' }, { transform: 'translate(' + (gx + (cols - 1) * gap + 40) + 'px,150px)' }], { duration: 800, easing: 'ease-out', fill: 'forwards' }).finished.catch(function () {})
      if (id !== runId) return
      if (t.n === Infinity) {
        result.setAttribute('class', 'ok'); result.textContent = '✓ Welcome'; say.textContent = 'Premium: always room'
        next.setAttribute('opacity', 0)
      } else {
        result.setAttribute('class', 'bad'); result.textContent = '✕ Blocked'
        next.firstChild.setAttribute('fill', 'var(--red)')
        say.textContent = t.n === 1 ? 'MyPlayBall: user 2 is blocked' : 'Basic: user 51 is blocked'
        if (!REDUCED) await next.animate([{ transform: 'translate(' + (gx + (cols - 1) * gap + 40) + 'px,150px)' }, { transform: 'translate(' + (gx + (cols - 1) * gap + 60) + 'px,150px)' }, { transform: 'translate(' + (gx + (cols - 1) * gap + 40) + 'px,150px)' }], { duration: 300, iterations: 2 }).finished.catch(function () {})
      }
    }
    btn.onclick = run
    pane._play = run
    return pane
  }

  function bundlePane() {
    var pane = h('div', 'pane')
    var stage = h('div', 'stage', pane)
    var svg = el('svg', { viewBox: '0 0 720 270', role: 'img', 'aria-label': 'Three Basic balls each hold up to 50 users and are not pooled' }, stage)
    var cap = h('div', 'cap', pane)
    var say = h('div', 'say', cap)
    say.setAttribute('aria-live', 'polite')
    var btn = h('button', 'btn', cap, '↻ Replay'); btn.type = 'button'
    async function run() {
      var id = ++runId
      while (svg.firstChild) svg.removeChild(svg.firstChild)
      el('rect', { x: 6, y: 6, width: 708, height: 196, rx: 12, fill: 'none', stroke: 'var(--brand)', 'stroke-dasharray': '6 5' }, svg)
      el('text', { x: 20, y: 28, style: 'fill:var(--brand);font-size:13px' }, svg, 'Basic Bundle 3')
      var targets = [50, 50, 20]
      var sets = targets.map(function (t, i) {
        var bx = 24 + i * 232
        el('text', { x: bx, y: 52 }, svg, 'Ball ' + (i + 1) + ' · Basic')
        return { dots: grid(svg, bx + 8, 72, 50, 10, 6.5, 17), x: bx, t: t }
      })
      var total = el('text', { x: 360, y: 246, 'text-anchor': 'middle', style: 'font-size:22px' }, svg, 'Users 0')
      say.textContent = 'Each ball has its own 50'
      if (!(await sleep(400, id))) return
      var count = 0
      for (var i = 0; i < 50; i++) {
        sets.forEach(function (s) { if (i < s.t) { s.dots[i].setAttribute('class', 'dot on'); count++ } })
        total.textContent = 'Users ' + count
        if (!(await sleep(45, id))) return
      }
      say.textContent = 'Ball 1 is full, ball 3 has room'
      if (!(await sleep(900, id))) return
      var nx = el('circle', { cx: 700, cy: 222, r: 10, fill: 'var(--accent)' }, svg)
      if (!REDUCED) await nx.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-590px)' }], { duration: 900, easing: 'ease-out', fill: 'forwards' }).finished.catch(function () {})
      if (id !== runId) return
      nx.setAttribute('fill', 'var(--red)')
      el('text', { x: 24, y: 192, class: 'bad', style: 'font-size:13px' }, svg, '✕ Blocked: ball 1 is full')
      say.textContent = 'Free slots on ball 3 do not help ball 1'
    }
    btn.onclick = run
    pane._play = run
    return pane
  }

  function overviewPane() {
    var pane = h('div', 'pane')

    function isKnown(t, u, b) {
      var a = S.known[t]
      return policy.value === 'tablet' ? a.some(function (e) { return e.split('|')[0] === u }) : a.indexOf(u + '|' + b) >= 0
    }
    function login(t, ball, u) {
      if (isKnown(t, u, ball)) return { k: 'info', text: 'logged in, no server call' }
      if (!online.checked) return { k: 'bad', text: 'blocked, go online first', blocked: true }
      var list = S[ball]
      if (list.indexOf(u) >= 0) { S.known[t].push(u + '|' + ball); return { k: 'info', text: 'already counted, no new slot' } }
      if (list.length < lim()) { list.push(u); S.known[t].push(u + '|' + ball); return { k: 'ok', text: 'counted ' + list.length + '/' + ls(lim()) } }
      return { k: 'bad', text: 'blocked, user limit reached', blocked: true }
    }
    // Tags go on the action where a question first shows up, so the graph stays readable.
    function tagsFor(action, res) {
      var t = [], once = function (id) { if (!S.seen[id]) { S.seen[id] = 1; t.push(id) } }
      if (res.blocked && /limit/.test(res.text)) once('Q1')
      if (res.blocked && /internet/.test(res.text)) once('Q5')
      if (res.k === 'ok' && S.x.length === lim() && /ball x$/.test(action)) once('F6')
      if (/^export to tablet 2/.test(action)) { if (/no server call/.test(res.text)) { t.push('Q9'); t.push('F1') } else if (res.k === 'ok') t.push('Q11') }
      if (/^export to tablet 1/.test(action) && /no server call/.test(res.text)) t.push('F2')
      return t
    }
    function rec(u, action, res) {
      S.rows.push([u, action, res]); S.hist.push({ x: S.x.length, y: S.y.length, blocked: !!res.blocked, tags: tagsFor(action, res) })
    }
    function step() { if (S.next > TOTAL) return; var u = 'a' + S.next++; rec(u, 'tablet 1 connects to ball x', login('t1', 'x', u)) }
    function exportUser() {
      var u = who.value; if (!u) return
      S.known.t2.push(u + '|*')
      rec(u, 'export to tablet 2, connect to ball y', login('t2', 'y', u))
    }
    function bypass() {
      var u = 'c' + (++S.c), r = login('t2', 'y', u)
      rec(u, 'new user on tablet 2, ball y', r)
      if (r.blocked) return
      S.known.t1.push(u + '|*')
      rec(u, 'export to tablet 1, connect to ball x', login('t1', 'x', u))
    }
    function paint() {
      var l = lim()
      ;[[nx, S.x], [ny, S.y]].forEach(function (p) { p[0].textContent = p[1].length + '/' + ls(l); p[0].className = 'n' + (l !== Infinity && p[1].length >= l ? ' full' : '') })
      tbody.textContent = ''
      S.rows.slice().reverse().forEach(function (r, i) {
        var tr = h('tr', '', tbody), idx = S.rows.length - i, p = S.hist[idx - 1]
        h('td', 'num', tr, String(idx)); h('td', 'num', tr, r[0]); h('td', '', tr, r[1])
        h('span', 'pl ' + r[2].k, h('td', '', tr), r[2].text)
        h('td', 'num', tr, p.x + '/' + ls(l)); h('td', 'num', tr, p.y + '/' + ls(l))
      })
      var blocked = S.hist.filter(function (p) { return p.blocked }).length
      sum.textContent = S.next > TOTAL
        ? 'a1 to a60 have all tried. ' + S.x.length + ' counted on ball x, ' + blocked + ' blocked in total.'
        : 'Next user: a' + S.next + '. ' + (S.next - 1) + ' of ' + TOTAL + ' have tried.'
      var cur = who.value; who.textContent = ''
      S.x.forEach(function (u) { var op = h('option', '', who, u); op.value = u })
      if (S.x.indexOf(cur) >= 0) who.value = cur
      bExp.disabled = !S.x.length
      bStep.disabled = bRun.disabled = S.next > TOTAL
      bBy.disabled = lim() === Infinity || S.x.length < lim()
      bBy.title = bBy.disabled ? 'Fill ball x to its cap first (Run to a60)' : ''
      drawGraph(gstage, S.hist, l, TOTAL, onTag)
    }
    function reset() { S = fresh(); paint() }
    bStep.onclick = function () { step(); paint() }
    bRun.onclick = function () { while (S.next <= TOTAL) step(); paint() }
    bReset.onclick = reset
    tier.onchange = reset; policy.onchange = reset; online.onchange = reset
    bExp.onclick = function () { exportUser(); paint() }
    bBy.onclick = function () { bypass(); paint() }
    reset()
  }

  function flowPane() {
    var pane = h('div', 'pane wide')
    var nav = h('div', 'seg', pane), secs = {}, btn = {}
    var SEC = [['chart', 'Flowcharts'], ['sim', 'Run a1 to a60 and graph'], ['qs', 'Inconsistencies']]
    function show(id) {
      SEC.forEach(function (s) { secs[s[0]].hidden = s[0] !== id; btn[s[0]].setAttribute('aria-pressed', s[0] === id ? 'true' : 'false') })
    }
    SEC.forEach(function (s) {
      btn[s[0]] = h('button', 'btn', nav, s[1]); btn[s[0]].type = 'button'
      secs[s[0]] = h('div', 'fsec', pane)
      btn[s[0]].onclick = function () { show(s[0]) }
    })
    var c = secs.chart
    h('p', 'fcap', c, 'Orange tags are open questions: Q is a question already in the Questions tab, F is new from this flow. Press any tag, on a diagram or below, to read it.')
    var cPanel = detailPanel(c)
    tagBar(c, ['Q1', 'Q5', 'Q7', 'Q9', 'F1', 'F2', 'F3', 'F4', 'F6', 'F7'], cPanel.show)
    h('h3', '', c, 'Flow A: a user logs in and is counted on a ball'); drawFlow(c, FLOW_A, cPanel.show)
    h('h3', '', c, 'Flow B: your scenario, user a exported to tablet 2 and ball y'); drawFlow(c, FLOW_B, cPanel.show)
    h('h3', '', c, 'Flow C: the same export used to get past a full ball'); drawFlow(c, FLOW_C, cPanel.show)
    var s = secs.sim
    h('p', 'fcap', s, 'Each user a1 to a60 tries once on tablet 1 and ball x. Change the tier, then export a user to tablet 2 and connect to ball y. The Q9 switch decides whether y ever counts the exported user. Tags on the graph mark the action where a question first shows up.')
    var sPanel = detailPanel(s)
    flowSim(s, sPanel.show)
    var q = secs.qs
    h('p', 'fcap', q, 'B blocks the design, O can wait. The last column is what I would build unless you decide otherwise.')
    var qt = h('div', 'qt', q), t = h('table', '', qt)
    var th = h('tr', '', h('thead', '', t)); ;['ID', 'Where', 'Problem', 'Suggested default'].forEach(function (x) { h('th', '', th, x) })
    var tbd = h('tbody', '', t)
    FLOW_QS.forEach(function (r) {
      var tr = h('tr', '', tbd), id = h('td', '', tr, r[0] + ' '); h('span', r[1] === 'B' ? 'sev-b' : 'sev-o', id, r[1])
      h('td', '', tr, r[2]); h('td', '', tr, r[3]); h('td', '', tr, r[4])
    })
    show('chart')
    return pane
  }

  var TABS = [
    { id: 'overview', name: 'Overview', pane: overviewPane },
    { id: 'first', name: 'First login', pane: function () { return scenePane({
        label: 'First login online: tablet asks the server, server adds the user', tablet: 'Tablet', sub: { ball: 'Basic · 50', tablet: 'online', server: 'Ball B' },
        intro: 'New user, internet on', start: { server: '12 / 50 users' },
        steps: [
          { say: 'Connect to the ball', move: ['tablet', 'ball', 'Connect'] },
          { say: 'Ask the server', move: ['tablet', 'server', 'New user?'] },
          { say: 'Slot free: user added', move: ['server', 'tablet', 'OK'], note: { server: '13 / 50 users' } },
          { say: 'Logged in', result: [true, 'Logged in'], note: { tablet: 'Remembered on tablet' }, hold: 1200 }
        ] }) } },
    { id: 'offline', name: 'Offline return', pane: function () { return scenePane({
        label: 'Returning user logs in with no internet, no server call', tablet: 'Tablet', sub: { ball: 'Basic · 50', tablet: 'offline', server: '' }, offline: true,
        intro: 'Known user, no internet', start: { tablet: 'Knows Ann' },
        steps: [
          { say: 'Connect to the ball', move: ['tablet', 'ball', 'Connect'] },
          { say: 'Tablet remembers Ann', note: { tablet: 'Ann ✓ seen before' }, hold: 900 },
          { say: 'Logged in, no internet needed', result: [true, 'Logged in offline'], hold: 1200 }
        ] }) } },
    { id: 'nonet', name: 'New user, no internet', pane: function () { return scenePane({
        label: 'New user without internet is blocked until the tablet is online', tablet: 'Tablet', sub: { ball: 'Basic · 50', tablet: 'offline', server: '' }, offline: true,
        intro: 'New user, no internet', start: { tablet: 'Never saw Bob' },
        steps: [
          { say: 'Connect to the ball', move: ['tablet', 'ball', 'Connect'] },
          { say: 'Ask the server', move: ['tablet', 'server', 'New user?'], fail: true },
          { say: 'No connection', result: [false, 'Go online first'], hold: 1400 }
        ] }) } },
    { id: 'second', name: 'Second tablet', pane: function () { return scenePane({
        label: 'Known user on a second tablet: one online check, no extra slot used', tablet: 'Tablet 2', sub: { ball: 'Basic · 50', tablet: 'online', server: 'Ball B' },
        intro: 'Ann used Tablet 1 before', start: { tablet: 'Never saw Ann', server: '13 / 50 users' },
        steps: [
          { say: 'Connect to the same ball', move: ['tablet', 'ball', 'Connect'] },
          { say: 'Ask the server', move: ['tablet', 'server', 'Ann here?'] },
          { say: 'Already counted: no new slot', move: ['server', 'tablet', 'Known'], note: { server: 'still 13 / 50' } },
          { say: 'Logged in', result: [true, 'Logged in'], hold: 1200 }
        ] }) } },
    { id: 'cap', name: 'User cap', pane: capPane },
    { id: 'bundle', name: 'Bundle', pane: bundlePane },
    { id: 'flow', name: 'Flow simulation', pane: flowPane }
  ]

  var tabs = document.getElementById('tabs'), main = document.getElementById('main')
  var panes = {}, btns = {}
  function select(id) {
    runId++
    TABS.forEach(function (t) {
      var on = t.id === id
      btns[t.id].setAttribute('aria-selected', on ? 'true' : 'false')
      btns[t.id].tabIndex = on ? 0 : -1
      if (on && !panes[t.id]) { panes[t.id] = t.pane(); main.appendChild(panes[t.id]) }
      if (panes[t.id]) panes[t.id].classList.toggle('on', on)
    })
    if (panes[id] && panes[id]._play) panes[id]._play()
    try { sessionStorage.setItem('lic2_tab', id) } catch (e) { /* storage may be blocked */ }
  }
  TABS.forEach(function (t, i) {
    var b = h('button', '', tabs, t.name)
    b.type = 'button'; b.setAttribute('role', 'tab'); b.id = 'tab-' + t.id
    b.onclick = function () { select(t.id) }
    b.onkeydown = function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0
      if (!d) return
      var n = TABS[(i + d + TABS.length) % TABS.length].id
      select(n); btns[n].focus()
    }
    btns[t.id] = b
  })
  // The scene comes from the URL hash (the feature page's side list sets it); standalone, the last tab is remembered.
  function fromHash() { var h = location.hash.replace(/^#/, ''); return btns[h] ? h : null }
  var start = fromHash() || 'overview'
  if (!fromHash()) try { start = sessionStorage.getItem('lic2_tab') || start } catch (e) { /* ignore */ }
  select(btns[start] ? start : 'overview')
  window.addEventListener('hashchange', function () { var h = fromHash(); if (h) select(h) })
})()
</script>
