<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature</title>
<style>
  /* Generic feature module (docs/spec/feature-modules.md), shown in a Product sub-tab iframe: /product/feature/page?f=<id>. */
  :root {
    --bg:#0f172a; --raised:#1e293b; --sunken:#0a0f1f; --line:#243044;
    --fg:#f1f5f9; --fg2:#cbd5e1; --fg3:#94a3b8;
    --brand:#22c55e; --gold:#eab308; --red:#ef4444; --blue:#38bdf8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; }
  button,textarea,input { font:inherit; color:inherit; }
  header { padding:14px 16px 0; display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  header .t { flex:1; min-width:200px; }
  h1 { margin:0; font-size:20px; }
  .sub { color:var(--fg3); font-size:13px; margin-top:2px; }
  .wis { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .wis a { font-size:12px; color:var(--blue); border:1px solid var(--line); border-radius:999px; padding:1px 9px; text-decoration:none; }
  .gold { background:var(--gold); color:#2a1f00; border:0; border-radius:8px; padding:9px 16px; font-weight:800; letter-spacing:.04em; cursor:pointer; }
  .gold:disabled { opacity:.5; cursor:default; }
  [role=tablist] { display:flex; gap:6px; padding:12px 16px 0; overflow-x:auto; border-bottom:1px solid var(--line); flex-shrink:0; }
  [role=tab] { background:none; border:0; border-bottom:3px solid transparent; color:var(--fg2); padding:8px 12px; cursor:pointer; white-space:nowrap; }
  [role=tab][aria-selected=true] { color:var(--fg); border-bottom-color:var(--brand); }
  [role=tab] .n { background:var(--gold); color:#2a1f00; border-radius:999px; font-size:11px; font-weight:800; padding:0 7px; margin-left:6px; }
  button:focus-visible,[role=tab]:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; }
  .pane { display:none; flex:1; min-height:0; }
  .pane.on { display:flex; }
  .scroll { flex:1; min-height:0; overflow:auto; padding:18px 16px 32px; }
  .col { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .btn { background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--fg3); }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#04210f; font-weight:700; }
  .btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .muted { color:var(--fg3); font-size:13px; }
  textarea,input[type=text] { width:100%; background:var(--sunken); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  textarea { min-height:90px; resize:vertical; }
  .card { background:var(--raised); border:1px solid var(--line); border-left:4px solid var(--fg3); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .card.block { border-left-color:var(--red); } .card.opt { border-left-color:var(--gold); } .card.done { border-left-color:var(--brand); }
  .badge { font-size:11px; font-weight:700; border-radius:999px; padding:1px 8px; border:1px solid var(--line); color:var(--fg2); }
  .badge.gold { background:var(--gold); color:#2a1f00; border:0; padding:1px 8px; font-weight:700; letter-spacing:0; }
  .badge.green { background:rgba(34,197,94,.18); color:var(--brand); border-color:transparent; }
  .badge.red { background:rgba(239,68,68,.18); color:#fca5a5; border-color:transparent; }
  .bar { background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#7f1d1d; color:#fff; border-radius:8px; padding:8px 14px; max-width:90vw; z-index:5; }
  .toast.ok { background:#14532d; }
  h2.sec { font-size:15px; margin:10px 0 0; color:var(--fg2); }
  /* markdown */
  .md h1 { font-size:22px; margin:0 0 .5em; } .md h2 { font-size:18px; margin:1.4em 0 .4em; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .md h3 { font-size:16px; margin:1.1em 0 .3em; } .md p { margin:.5em 0; } .md ul,.md ol { margin:.4em 0; padding-left:1.4em; }
  .md blockquote { margin:.6em 0; padding:.2em .9em; border-left:3px solid var(--brand); color:var(--fg2); background:var(--sunken); }
  .md code { font-family:var(--mono); font-size:.9em; background:var(--sunken); padding:1px 5px; border-radius:4px; }
  .md pre { background:var(--sunken); padding:10px; border-radius:8px; overflow:auto; } .md pre code { padding:0; background:none; }
  .md table { border-collapse:collapse; margin:.6em 0; } .md th,.md td { border:1px solid var(--line); padding:5px 10px; text-align:left; }
  .md th { background:var(--sunken); } .md hr { border:0; border-top:1px solid var(--line); }
  #editor { min-height:60vh; font-family:var(--mono); font-size:13px; }
  /* visuals */
  #p-visuals { flex-direction:row; }
  #sceneNav { width:210px; flex-shrink:0; border-right:1px solid var(--line); overflow:auto; padding:10px 8px; display:flex; flex-direction:column; gap:4px; }
  #sceneNav button { text-align:left; background:none; border:0; border-left:3px solid transparent; color:var(--fg2); padding:7px 10px; border-radius:0 6px 6px 0; cursor:pointer; }
  #sceneNav button small { display:block; color:var(--fg3); font-size:12px; }
  #sceneNav button[aria-current=true] { background:var(--raised); border-left-color:var(--brand); color:var(--fg); }
  #sceneFrame { flex:1; border:0; min-width:0; background:var(--bg); }
  @media (max-width:640px) {
    #p-visuals { flex-direction:column; }
    #sceneNav { width:auto; flex-direction:row; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; padding:6px 8px; }
    #sceneNav button small { display:none; } #sceneNav button { border-left:0; border-bottom:3px solid transparent; white-space:nowrap; }
    #sceneNav button[aria-current=true] { border-bottom-color:var(--brand); }
  }
  /* timeline */
  .tl { list-style:none; margin:0; padding:0 0 0 14px; border-left:2px solid var(--line); display:flex; flex-direction:column; gap:12px; }
  .tl li { position:relative; } .tl li::before { content:""; position:absolute; left:-21px; top:6px; width:10px; height:10px; border-radius:50%; background:var(--fg3); }
  .tl li.k-refine::before,.tl li.k-spec-edit::before { background:var(--brand); } .tl li.k-work-item::before { background:var(--gold); } .tl li.k-refine-failed::before { background:var(--red); }
  .tl .when { color:var(--fg3); font-size:12px; }
  .diff { font-family:var(--mono); font-size:12px; background:var(--sunken); border-radius:6px; padding:6px 8px; margin-top:6px; overflow:auto; max-height:260px; white-space:pre-wrap; }
  .diff .a { color:#86efac; } .diff .r { color:#fca5a5; } .diff .c { color:var(--fg3); } .diff .h { color:var(--blue); }
  details summary { cursor:pointer; color:var(--blue); font-size:13px; }
  dialog { background:var(--raised); color:var(--fg); border:1px solid var(--line); border-radius:12px; max-width:520px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
</style>
</head>
<body>
<header>
  <div class="t"><h1 id="title">Feature</h1><div class="sub" id="subtitle"></div><div class="wis" id="wis"></div></div>
  <button type="button" class="gold" id="wiBtn" hidden>TURN INTO WORK ITEM</button>
</header>
<div role="tablist" id="tabs" aria-label="Feature sections"></div>
<main id="main">
  <section class="pane" id="p-spec"><div class="scroll"><div class="col" id="specCol"></div></div></section>
  <section class="pane" id="p-visuals"><nav id="sceneNav" aria-label="Animations"></nav><iframe id="sceneFrame" title="Animation"></iframe></section>
  <section class="pane" id="p-questions"><div class="scroll"><div class="col" id="qCol"></div></div></section>
  <section class="pane" id="p-notes"><div class="scroll"><div class="col" id="nCol"></div></div></section>
</main>
<dialog id="wiDialog">
  <h2 style="margin-top:0">Turn into a work item?</h2>
  <p id="wiText" class="muted"></p>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="wiCancel">Cancel</button><button type="button" class="gold" id="wiGo">Create work item</button></div>
</dialog>

<script>
(function () {
  'use strict'
  var FID = new URLSearchParams(location.search).get('f') || ''
  var NAME_KEY = 'pw_suggestion_voter_name'   // the same remembered name the rest of spec-web uses
  var D = null              // last view from the server
  var tab = 'spec', editing = false, sceneId = null, timer = null

  function h(tag, cls, parent, text) {
    var n = document.createElement(tag)
    if (cls) n.className = cls
    if (text != null) n.textContent = text
    if (parent) parent.appendChild(n)
    return n
  }
  function btn(label, cls, parent, fn) { var b = h('button', 'btn ' + (cls || ''), parent, label); b.type = 'button'; b.onclick = fn; return b }
  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v) } catch (e) { /* storage may be blocked */ } return null }

  function toast(msg, ok) {
    var t = h('div', 'toast' + (ok ? ' ok' : ''), document.body, msg)
    setTimeout(function () { t.remove() }, ok ? 3500 : 7000)
  }
  function who() {
    var n = ''
    try { n = (localStorage.getItem(NAME_KEY) || '').trim() } catch (e) { /* asked each time */ }
    if (!n) {
      n = (prompt('Who is this? (shown in the timeline)') || '').trim().slice(0, 40)
      if (n) try { localStorage.setItem(NAME_KEY, n) } catch (e) { /* kept for this load only */ }
    }
    return n
  }
  function api(method, path, body) {
    return fetch('/api/features/' + encodeURIComponent(FID) + path, {
      method: method, credentials: 'same-origin',
      headers: body ? { 'content-type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {} }).then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j })
    })
  }
  function act(path, body, okMsg) {
    var by = who(); if (!by) return Promise.reject(new Error('cancelled'))
    body.by = by
    return api('POST', path, body).then(function (j) { if (okMsg) toast(okMsg, true); return load().then(function () { return j }) }, function (e) { toast(e.message); throw e })
  }
  function ilTime(iso) { try { return new Date(iso).toLocaleString('en-GB', { timeZone: 'Asia/Jerusalem', dateStyle: 'medium', timeStyle: 'short' }) } catch (e) { return iso } }

  // ── tiny markdown renderer (escapes first; only what the feature specs use) ─────────────────────
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
  }
  function md(src) {
    var lines = src.replace(/\r\n/g, '\n').split('\n'), out = [], i = 0
    while (i < lines.length) {
      var l = lines[i], m
      if (/^```/.test(l)) { var code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) { out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue }
      if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue }
      if (/^>/.test(l)) { var q = []; while (i < lines.length && /^>/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>'); continue }
      if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
        var cells = function (r) { return r.replace(/^\||\|\s*$/g, '').split('|').map(function (c) { return c.trim() }) }
        var head = cells(l), rows = []; i += 2
        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]))
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>' }).join('') + '</tr></thead><tbody>' +
          rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>' }).join('') + '</tr>' }).join('') + '</tbody></table>')
        continue
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        var ord = /^\s*\d+\./.test(l), items = []
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, '')))
        out.push((ord ? '<ol>' : '<ul>') + items.map(function (x) { return '<li>' + x + '</li>' }).join('') + (ord ? '</ol>' : '</ul>')); continue
      }
      if (!l.trim()) { i++; continue }
      var p = []
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\||\s*([-*]|\d+\.)\s+|---)/.test(lines[i])) p.push(lines[i++])
      out.push('<p>' + inline(p.join(' ')) + '</p>')
    }
    return out.join('\n')
  }

  // ── header + tabs ───────────────────────────────────────────────────────────────────────────────
  var TABS = [['spec', 'Spec'], ['visuals', 'Visuals'], ['questions', 'Questions'], ['notes', 'Notes']]
  function renderHeader() {
    document.title = D.title
    document.getElementById('title').textContent = D.title
    document.getElementById('subtitle').textContent = D.subtitle
    var wis = document.getElementById('wis'); wis.textContent = ''
    D.workItems.forEach(function (w) {
      var a = h('a', '', wis, w.id + ' · ' + w.status); a.href = '/work'; a.target = '_top'; a.title = w.title
    })
    var b = document.getElementById('wiBtn'); b.hidden = !D.canEdit
    var open = D.workItems.some(function (w) { return ['done', 'cancelled', 'failed'].indexOf(w.status) < 0 })
    b.disabled = open; b.title = open ? 'A work item for this feature is still open.' : ''
    var tabs = document.getElementById('tabs'); tabs.textContent = ''
    TABS.forEach(function (t) {
      var el = h('button', '', tabs, t[1]); el.type = 'button'; el.setAttribute('role', 'tab'); el.setAttribute('aria-selected', t[0] === tab ? 'true' : 'false')
      var n = t[0] === 'questions' ? D.questions.filter(function (q) { return !q.answer }).length : t[0] === 'notes' ? D.notes.length : 0
      if (n) h('span', 'n', el, String(n))
      el.onclick = function () { select(t[0]) }
    })
  }
  function select(t) {
    tab = t; store('feat_' + FID + '_tab', t)
    TABS.forEach(function (x) { document.getElementById('p-' + x[0]).classList.toggle('on', x[0] === t) })
    if (D) renderHeader()
    if (t === 'visuals') showScene()
  }

  // ── spec ────────────────────────────────────────────────────────────────────────────────────────
  function renderSpec() {
    var col = document.getElementById('specCol'); col.textContent = ''
    if (editing) {
      var ta = h('textarea', '', col); ta.id = 'editor'; ta.value = D.spec; ta.setAttribute('aria-label', 'Feature spec (Markdown)')
      var row = h('div', 'row', col)
      btn('Save', 'primary', row, function () {
        act('/spec', { content: ta.value, base: D.hash }, 'Saved').then(function () { editing = false; renderAll() }, function () {})
      })
      btn('Cancel', '', row, function () { editing = false; renderAll() })
      h('span', 'muted', row, 'Saved edits appear in the timeline. Use "Update the spec" on the Questions tab to let Claude apply answers and notes.')
      return
    }
    if (D.canEdit) { var r = h('div', 'row', col); btn('Edit the spec', '', r, function () { editing = true; renderAll() }) }
    var doc = h('div', 'md', col); doc.innerHTML = md(D.spec)
  }

  // ── visuals ─────────────────────────────────────────────────────────────────────────────────────
  var navBuilt = false
  function showScene() {
    var v = D.visuals, nav = document.getElementById('sceneNav'), frame = document.getElementById('sceneFrame')
    if (!v) { nav.textContent = ''; h('p', 'muted', nav, 'This feature has no animations.'); frame.removeAttribute('src'); return }
    var saved = store('feat_' + FID + '_scene')
    if (!sceneId) sceneId = v.scenes.some(function (s) { return s.id === saved }) ? saved : v.scenes[0].id
    if (!navBuilt) {
      v.scenes.forEach(function (s) {
        var b = h('button', '', nav, s.title); b.type = 'button'; b.dataset.id = s.id
        if (s.hint) h('small', '', b, s.hint)
        b.onclick = function () { sceneId = s.id; store('feat_' + FID + '_scene', s.id); showScene() }
      })
      navBuilt = true
    }
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) { b.setAttribute('aria-current', b.dataset.id === sceneId ? 'true' : 'false') })
    var want = v.src + '?embed=1#' + sceneId
    // Same page, new hash: the animation page listens for hashchange, so nothing reloads.
    if (frame.getAttribute('src') !== want) frame.setAttribute('src', want)
  }

  // ── questions + timeline ────────────────────────────────────────────────────────────────────────
  function diffBox(hunks) {
    var box = h('div', 'diff')
    hunks.forEach(function (hk) {
      h('div', 'h', box, '@@ line ' + hk.bStart + ' @@')
      hk.lines.forEach(function (l) { h('div', l.t === '+' ? 'a' : l.t === '-' ? 'r' : 'c', box, l.t + l.s) })
    })
    return box
  }
  function questionCard(q, parent) {
    var c = h('div', 'card ' + (q.answer ? 'done' : q.blocking ? 'block' : 'opt'), parent)
    var top = h('div', 'row', c)
    h('b', 'grow', top, 'Q' + q.n + '. ' + q.text)
    h('span', 'badge ' + (q.blocking ? 'red' : ''), top, q.blocking ? 'blocking' : 'optional')
    if (q.answer) {
      h('div', '', c, q.answer)
      var meta = h('div', 'row', c)
      h('span', 'muted', meta, 'Answered by ' + q.answeredBy + ' · ' + ilTime(q.answeredAt))
      h('span', q.appliedAt ? 'badge green' : 'badge gold', meta, q.appliedAt ? 'in the spec' : 'not in the spec yet')
    }
    var form = D.canEdit ? h('div', '', c) : null, ta = null
    if (form) { ta = h('textarea', '', form); ta.style.minHeight = '60px' }
    if (q.options && q.options.length) {
      // Suggestions only: clicking one copies it into the answer box, nothing is saved until Save answer.
      var opts = h('div', '', c); opts.style.cssText = 'display:flex;flex-direction:column;gap:4px;margin-top:6px'
      h('div', 'muted', opts, 'Possible answers' + (D.canEdit ? ' (click to use)' : ''))
      q.options.forEach(function (o, i) {
        var ob = h('button', '', opts, String.fromCharCode(65 + i) + ') ' + o)
        ob.type = 'button'; ob.style.cssText = 'text-align:left;font:inherit;font-size:13px;background:var(--sunken);color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer'
        if (ta) ob.onclick = function () { ta.value = o; ta.focus() }
        else ob.disabled = true
      })
      if (form) c.appendChild(form)
    }
    if (form) {
      ta.placeholder = q.answer ? 'Change the answer…' : 'Your answer…'; ta.setAttribute('aria-label', 'Answer to question ' + q.n)
      var r = h('div', 'row', form); r.style.marginTop = '6px'
      btn(q.answer ? 'Save new answer' : 'Save answer', 'primary', r, function () { act('/answer', { n: q.n, text: ta.value }).catch(function () {}) })
      btn('Remove question', '', r, function () { if (confirm('Remove Q' + q.n + '?')) act('/remove-question', { n: q.n }).catch(function () {}) })
    }
  }
  function renderQuestions() {
    var col = document.getElementById('qCol'); col.textContent = ''
    var pend = D.pending.answers + D.pending.notes
    var bar = h('div', 'bar', col), top = h('div', 'row', bar)
    h('div', 'grow', top, pend
      ? D.pending.answers + ' answer' + (D.pending.answers === 1 ? '' : 's') + ' and ' + D.pending.notes + ' note' + (D.pending.notes === 1 ? '' : 's') + ' are not in the spec yet.'
      : 'Everything answered or noted is already in the spec.')
    var running = D.refine && D.refine.status === 'running'
    if (D.canEdit) {
      var b = btn(running ? 'Updating the spec…' : 'Analyze answers and notes → update the spec', 'primary', top, function () {
        b.disabled = true; act('/refine', {}, 'Claude is updating the spec').catch(function () { b.disabled = false })
      })
      b.disabled = running || !pend
    }
    if (running) {
      var step = D.run && D.run.steps && D.run.steps.length ? D.run.steps[D.run.steps.length - 1].text : 'Starting…'
      h('div', 'muted', bar, 'Claude is working: ' + step)
    } else if (D.refine && D.refine.finishedAt) {
      h('div', 'muted', bar, 'Last update ' + D.refine.status + ' · ' + ilTime(D.refine.finishedAt) + (D.refine.summary ? ' · ' + D.refine.summary : ''))
    }
    if (D.canEdit) {
      var ask = h('div', 'bar', col); h('b', '', ask, 'Ask a question')
      var ta = h('textarea', '', ask); ta.style.minHeight = '60px'; ta.setAttribute('aria-label', 'New question')
      var r = h('div', 'row', ask), lab = h('label', 'muted', r), cb = h('input', '', lab); cb.type = 'checkbox'
      lab.appendChild(document.createTextNode(' Blocking (the spec cannot be finished without it)'))
      h('span', 'grow', r)
      btn('Add question', '', r, function () { act('/question', { text: ta.value, blocking: cb.checked }).catch(function () {}) })
    }
    var open = D.questions.filter(function (q) { return !q.answer }), done = D.questions.filter(function (q) { return q.answer })
    h('h2', 'sec', col, 'Open questions (' + open.length + ')')
    open.forEach(function (q) { questionCard(q, col) })
    if (!open.length) h('p', 'muted', col, 'No open questions.')
    if (done.length) { h('h2', 'sec', col, 'Answered (' + done.length + ')'); done.forEach(function (q) { questionCard(q, col) }) }
    h('h2', 'sec', col, 'Timeline')
    var tl = h('ul', 'tl', col)
    D.timeline.forEach(function (e) {
      var li = h('li', 'k-' + e.kind, tl)
      h('div', 'when', li, ilTime(e.at) + ' · ' + e.by)
      h('div', '', li, e.text)
      if (e.hunks && e.hunks.length) {
        var d = h('details', '', li); h('summary', '', d, '+' + e.added + ' −' + e.removed + ' lines in the spec')
        d.addEventListener('toggle', function () { if (d.open && !d.querySelector('.diff')) d.appendChild(diffBox(e.hunks)) })
      }
    })
  }

  // ── notes ───────────────────────────────────────────────────────────────────────────────────────
  function renderNotes() {
    var col = document.getElementById('nCol'); col.textContent = ''
    h('p', 'muted', col, 'Notes are loose thoughts about the feature. They are read together with the answers when Claude updates the spec.')
    if (D.canEdit) {
      var ta = h('textarea', '', col); ta.setAttribute('aria-label', 'New note')
      var r = h('div', 'row', col)
      btn('Add note', 'primary', r, function () { act('/note', { text: ta.value }).catch(function () {}) })
    }
    D.notes.slice().reverse().forEach(function (n) {
      var c = h('div', 'card ' + (n.appliedAt ? 'done' : 'opt'), col)
      h('div', '', c, n.text).style.whiteSpace = 'pre-wrap'
      var m = h('div', 'row', c)
      h('span', 'muted grow', m, n.by + ' · ' + ilTime(n.at))
      h('span', n.appliedAt ? 'badge green' : 'badge gold', m, n.appliedAt ? 'in the spec' : 'not in the spec yet')
      if (D.canEdit) btn('Delete', '', m, function () { if (confirm('Delete this note?')) act('/remove-note', { n: n.n }).catch(function () {}) })
    })
  }

  // ── turn into work item ─────────────────────────────────────────────────────────────────────────
  function wiDialog() {
    var dlg = document.getElementById('wiDialog')
    var again = D.workItems.length > 0
    document.getElementById('wiText').textContent =
      (again ? 'Only the part of the spec that changed since the last work item is sent. ' : '') +
      'Claude will analyze the feature spec and rewrite the whole product spec to include it (docs/spec, CLAUDE.md, SPEC.md), asking you any blocking questions first. You review the new spec text before anything is built. Nothing is pushed or deployed.'
    document.getElementById('wiCancel').onclick = function () { dlg.close() }
    document.getElementById('wiGo').onclick = function () {
      var go = document.getElementById('wiGo'); go.disabled = true
      act('/work-item', {}).then(function (j) {
        dlg.close(); toast(j.item.id + ' created' + (j.started ? ' · analysis started' : ' · press Analyze in the Work tab'), true)
      }, function () { dlg.close() }).then(function () { go.disabled = false })
    }
    dlg.showModal()
  }

  // ── load ────────────────────────────────────────────────────────────────────────────────────────
  function renderAll() {
    renderHeader()
    if (!editing || !document.getElementById('editor')) renderSpec()
    renderQuestions(); renderNotes()
    if (tab === 'visuals') showScene()
    document.getElementById('p-' + tab).classList.add('on')
  }
  function typing() { var a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') }
  function load(poll) {
    return api('GET', '').then(function (d) {
      D = d
      // Never replace what the person is typing: while the editor is open (or a background refresh finds a field focused) only the header refreshes.
      if (editing || (poll === true && typing())) renderHeader(); else renderAll()
      clearTimeout(timer)
      if (D.refine && D.refine.status === 'running') timer = setTimeout(function () { load(true) }, 3000)
    }, function (e) {
      document.getElementById('title').textContent = 'Feature not found'
      document.getElementById('subtitle').textContent = e.message
    })
  }
  document.getElementById('wiBtn').onclick = wiDialog
  var saved = store('feat_' + FID + '_tab')
  if (TABS.some(function (t) { return t[0] === saved })) tab = saved
  TABS.forEach(function (t) { document.getElementById('p-' + t[0]).classList.toggle('on', t[0] === tab) })
  load()
})()
</script>
</body>
</html>
